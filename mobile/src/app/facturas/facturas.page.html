<ion-header class="ion-no-border">
  <ion-toolbar class="topbar">
    <ion-buttons slot="start">
      <ion-icon class="icono-cabecera" name="receipt-outline"></ion-icon>
    </ion-buttons>
    <ion-title>Facturas</ion-title>
    <app-avatar-btn slot="end"></app-avatar-btn>
  </ion-toolbar>
</ion-header>

<ion-content class="fac-content">
  <div class="page">
    <div class="barra">
      <div class="ambito-toggle wrap">
        <button
          type="button"
          *ngFor="let p of pestanas"
          [class.active]="pestana === p.id"
          (click)="cambiarPestana(p.id)"
        >
          {{ p.etiqueta }}
        </button>
      </div>
      <button type="button" class="btn btn-outline btn-sm" (click)="reclasificar()" [disabled]="reclasificando">
        {{ reclasificando ? 'Reclasificando…' : 'Reclasificar' }}
      </button>
    </div>

    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <div class="card list">
      <div class="empty" *ngIf="cargando">Cargando…</div>
      <div class="empty" *ngIf="!cargando && !filas.length">
        <div class="icon">🧾</div>
        <ng-container *ngIf="pestana === 'desconocido'">No hay facturas sin clasificar.</ng-container>
        <ng-container *ngIf="pestana !== 'desconocido'">
          No hay facturas aquí. Sube un PDF o imagen en Archivos y se escaneará sola.
        </ng-container>
      </div>

      <button
        type="button"
        class="fila"
        *ngFor="let f of filas; trackBy: trackFila"
        (click)="abrir(f)"
      >
        <div class="fila-top">
          <strong>{{ tituloFila(f) }}</strong>
          <span class="badge" [ngClass]="'t-' + f.tipo">{{ etiquetaTipo(f.tipo) }}</span>
        </div>
        <div class="fila-meta muted">
          <span>{{ fechaCorta(f.fecha) }}</span>
          <span *ngIf="f.emisor"> · {{ f.emisor }}</span>
        </div>
        <div class="fila-imp">{{ dinero(f.total, f.moneda) }}</div>
      </button>

      <div class="paginacion" *ngIf="!cargando && total > 0">
        <button type="button" class="btn btn-outline btn-sm" [disabled]="pagina <= 1" (click)="irPagina(pagina - 1)">←</button>
        <span class="muted">Página {{ pagina }} de {{ paginas }}</span>
        <button type="button" class="btn btn-outline btn-sm" [disabled]="pagina >= paginas" (click)="irPagina(pagina + 1)">→</button>
      </div>
    </div>
  </div>
</ion-content>

<div class="editor" *ngIf="form as f">
  <div class="editor-bar">
    <strong>Editar factura</strong>
    <button type="button" class="btn btn-ghost btn-sm" (click)="cerrarEditor()">Cerrar</button>
  </div>
  <div class="editor-body">
    <p class="muted" *ngIf="f.archivoNombre">{{ f.archivoNombre }}</p>

    <label class="field">
      Nº de factura
      <input class="input" type="text" [(ngModel)]="f.numero" name="numero" />
    </label>
    <label class="field">
      Fecha
      <input class="input" type="date" [(ngModel)]="f.fecha" name="fecha" />
    </label>
    <label class="field">
      Tipo
      <select class="input" [(ngModel)]="f.tipo" name="tipo">
        <option value="venta">Venta</option>
        <option value="compra">Compra</option>
        <option value="desconocido">Sin clasificar</option>
      </select>
    </label>
    <label class="field">
      Moneda
      <input class="input" type="text" [(ngModel)]="f.moneda" name="moneda" placeholder="EUR" />
    </label>
    <label class="field">
      Emisor
      <input class="input" type="text" [(ngModel)]="f.emisor" name="emisor" />
    </label>
    <label class="field">
      CIF emisor
      <input class="input" type="text" [(ngModel)]="f.emisorNif" name="emisorNif" />
    </label>
    <label class="field">
      Cliente
      <input class="input" type="text" [(ngModel)]="f.cliente" name="cliente" />
    </label>
    <label class="field">
      CIF cliente
      <input class="input" type="text" [(ngModel)]="f.clienteNif" name="clienteNif" />
    </label>

    <div class="lineas-head">
      <h3>Líneas</h3>
      <button type="button" class="btn btn-outline btn-sm" (click)="addLinea()">+ Línea</button>
    </div>
    <p class="muted" *ngIf="!f.lineas.length">Sin líneas.</p>
    <div class="linea" *ngFor="let l of f.lineas; let i = index; trackBy: trackLinea">
      <input class="input" type="text" [(ngModel)]="l.descripcion" [name]="'ld' + i" placeholder="Descripción" />
      <div class="linea-nums">
        <input class="input" type="number" step="any" [(ngModel)]="l.cantidad" [name]="'lc' + i" placeholder="Cant." />
        <input class="input" type="number" step="any" [(ngModel)]="l.precioUnit" [name]="'lp' + i" placeholder="Precio" />
        <input class="input" type="number" step="any" [(ngModel)]="l.total" [name]="'lt' + i" placeholder="Total" />
      </div>
      <button type="button" class="btn btn-ghost btn-sm" (click)="quitarLinea(i)">Quitar</button>
    </div>

    <div class="totales">
      <label class="field">
        Subtotal
        <input class="input" type="number" step="any" [(ngModel)]="f.subtotal" name="subtotal" />
      </label>
      <label class="field">
        IVA
        <input class="input" type="number" step="any" [(ngModel)]="f.iva" name="iva" />
      </label>
      <label class="field">
        Total
        <input class="input" type="number" step="any" [(ngModel)]="f.total" name="total" />
      </label>
    </div>

    <div class="acciones">
      <button type="button" class="btn btn-ghost" (click)="cerrarEditor()">Cancelar</button>
      <button type="button" class="btn btn-primary" [disabled]="guardando" (click)="guardar()">
        {{ guardando ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
