<ion-header class="ion-no-border">
  <ion-toolbar class="topbar">
    <div slot="start" class="logo-row">
      <img src="assets/ateka-logo.png" alt="" />
      ATEKA <span class="green">Cloud</span>
    </div>
    <ion-buttons slot="end">
      <ion-button (click)="abrirMenu()" aria-label="Más acciones">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
    <app-avatar-btn slot="end"></app-avatar-btn>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content" [scrollY]="false">
  <div class="mensajes" #lista>
    <div class="empty" *ngIf="mensajes.length === 0 && !chat.pensando">
      <p>Hola{{ usuario?.nombre ? ', ' + usuario.nombre : '' }}.</p>
      <p class="muted">Escribe un mensaje para hablar con el asistente.</p>
    </div>

    <div *ngFor="let m of mensajes" class="burbuja" [class.usuario]="m.de === 'usuario'" [class.bot]="m.de === 'bot'">
      <div *ngIf="m.de === 'usuario'" class="texto">{{ m.texto }}</div>
      <div *ngIf="m.de === 'bot'" class="md" [innerHTML]="renderBot(m.texto)"></div>

      <div class="tabla" *ngIf="m.tabla as t">
        <p *ngFor="let fila of filasVisibles(t)">{{ lineaFila(t, fila) }}</p>
        <p class="muted" *ngIf="t.filas.length > filasVisibles(t).length">
          …y {{ t.filas.length - filasVisibles(t).length }} más.
        </p>
      </div>
    </div>

    <div class="burbuja bot" *ngIf="chat.pensando">
      <p class="muted">Pensando…</p>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border pie-chat">
  <ion-toolbar class="barra-toolbar">
    <form class="barra" (ngSubmit)="enviar()">
      <ion-input
        class="input-chat"
        name="entrada"
        [(ngModel)]="chat.borrador"
        [placeholder]="chat.pensando ? 'La IA está pensando…' : 'Escribe tu mensaje…'"
        autocomplete="off"
        inputmode="text"
        enterkeyhint="send"
        (ionFocus)="mostrarTeclado()"
      ></ion-input>
      <button class="btn-enviar" type="submit" [disabled]="!chat.borrador.trim()">
        Enviar
      </button>
    </form>
  </ion-toolbar>
</ion-footer>
