<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <span class="logo-badge">
          <img src="assets/ateka-logo.png" alt="ATEKA" />
        </span>
        <span>ATEKA <span class="green">Cloud</span></span>
      </div>
      <h1 class="auth-title">Iniciar sesión</h1>

      <form (ngSubmit)="enviar()">
        <label for="email">Email</label>
        <input
          id="email"
          class="input"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tucorreo@ejemplo.com"
          required
          autocomplete="username"
        />

        <label for="password">Contraseña</label>
        <div class="pwd-wrap">
          <input
            id="password"
            class="input"
            [type]="mostrarPass ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Tu contraseña"
            required
            autocomplete="current-password"
          />
         <button type="button" class="pwd-toggle" (click)="mostrarPass = !mostrarPass">
            <svg *ngIf="!mostrarPass" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="mostrarPass" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        @if (error) {
          <p class="error-msg">{{ error }}</p>
        }

        <button class="btn-entrar" type="submit" [disabled]="cargando || !email || !password">
          {{ cargando ? 'Procesando…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</ion-content>
