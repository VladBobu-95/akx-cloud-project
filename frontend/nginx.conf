server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Permite subir archivos hasta 50 MB (el backend tiene ese límite).
  client_max_body_size 50m;

  # Rutas de Angular (SPA): si el fichero no existe, servir index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Las peticiones /api/** se reenvían al contenedor del backend (misma red de
  # Docker). Así el navegador usa el mismo origen y no hay problemas de CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El chat (bucle de tool calling) y el OCR de facturas pueden tardar algo
    # más que el timeout por defecto de nginx (60s). Además, el Ollama del
    # servidor es COMPARTIDO por varias apps: si otra echa el modelo de la GPU,
    # la 1ª petición recarga qwen2.5-coder:14b (~9 GB) en frío y puede tardar
    # >120s. 300s absorbe esa carga en frío puntual sin dar 504. El arreglo de
    # fondo es OLLAMA_KEEP_ALIVE=-1 en el contenedor ollama (que no lo descargue).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
